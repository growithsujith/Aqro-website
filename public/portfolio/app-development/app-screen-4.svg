<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021428"/>
      <stop offset="100%" stop-color="#083866"/>
    </linearGradient>
    <linearGradient id="heroCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="100%" stop-color="#004AAD"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg4)"/>
  
  <g transform="translate(24, 60)">
    <text x="0" y="20" fill="#5B9BFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DIGITAL STORE</text>
    <text x="0" y="50" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="26" font-weight="700">Artisan Gear</text>
  </g>

  <!-- Featured Item -->
  <g transform="translate(24, 135)">
    <rect width="342" height="240" rx="20" fill="url(#heroCard)"/>
    <circle cx="171" cy="95" r="55" fill="#FFFFFF" opacity="0.15"/>
    <text x="171" y="105" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="40" text-anchor="middle">⚡</text>
    <text x="24" y="185" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">AQRO Kinetic Series 01</text>
    <text x="24" y="212" fill="#FFFFFF" opacity="0.85" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">₹ 8,990 • Limited Edition</text>
  </g>

  <!-- Categories -->
  <g transform="translate(24, 400)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Explore Categories</text>
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="162" height="80" rx="16" fill="#0C2545"/>
      <text x="20" y="46" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Devices</text>
      
      <rect x="180" y="0" width="162" height="80" rx="16" fill="#0C2545"/>
      <text x="200" y="46" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Software</text>
    </g>
  </g>

  <!-- Bottom CTA bar -->
  <g transform="translate(24, 530)">
    <rect width="342" height="60" rx="18" fill="#ED1C24"/>
    <text x="171" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Add to Bag • Instant Checkout</text>
  </g>
</svg>
