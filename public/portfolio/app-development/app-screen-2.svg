    <text x="24" y="80" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">1.48M</text>
    <text x="170" y="76" fill="#2ECC71" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">+28.4%</text>

    <!-- Chart path -->
    <path d="M 24 180 C 70 140, 120 160, 160 120 C 200 90, 240 130, 280 80 C 300 60, 318 70, 318 70" fill="none" stroke="#5B9BFF" stroke-width="3"/>
    <path d="M 24 180 C 70 140, 120 160, 160 120 C 200 90, 240 130, 280 80 C 300 60, 318 70, 318 70 L 318 200 L 24 200 Z" fill="url(#chartGrad)"/>
  </g>

  <!-- KPI Grid -->
