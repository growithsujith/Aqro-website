    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B9BFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#004AAD" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg2)"/>
  
  <g transform="translate(24, 60)">
    <text x="0" y="20" fill="#5B9BFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AI ANALYTICS</text>
