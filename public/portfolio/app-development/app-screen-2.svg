      <rect width="162" height="130" rx="18" fill="#111B30" stroke="#1F2D4E" stroke-width="1"/>
      <circle cx="28" cy="30" r="14" fill="#ED1C24" opacity="0.2"/>
      <text x="28" y="35" fill="#ED1C24" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">★</text>
      <text x="20" y="75" fill="#A0AEC0" font-family="-apple-system, sans-serif" font-size="13">Conversion</text>
      <text x="20" y="105" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="22" font-weight="700">4.82%</text>
