  <g transform="translate(24, 500)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Recent Transactions</text>
    
    <g transform="translate(0, 20)">
      <rect width="342" height="64" rx="16" fill="#0A1832"/>
      <circle cx="36" cy="32" r="18" fill="#004AAD"/>
      <text x="68" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Apple Store India</text>
      <text x="68" y="46" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" opacity="0.6">Electronic • Today</text>
      <text x="320" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="end">- ₹ 14,900</text>
    </g>

    <g transform="translate(0, 96)">
      <rect width="342" height="64" rx="16" fill="#0A1832"/>
      <circle cx="36" cy="32" r="18" fill="#008060"/>
      <text x="68" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Client Retainer</text>
      <text x="68" y="46" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" opacity="0.6">Invoice #482 • Yesterday</text>
      <text x="320" y="38" fill="#2ECC71" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="end">+ ₹ 85,000</text>
    </g>

    <g transform="translate(0, 172)">
      <rect width="342" height="64" rx="16" fill="#0A1832"/>
      <circle cx="36" cy="32" r="18" fill="#ED1C24"/>
      <text x="68" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">Cloud Infrastructure</text>
      <text x="68" y="46" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" opacity="0.6">Monthly API • 8 Nov</text>
      <text x="320" y="38" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="end">- ₹ 6,420</text>
    </g>
