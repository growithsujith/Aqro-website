<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="100%" stop-color="#00214D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004AAD"/>
      <stop offset="100%" stop-color="#ED1C24"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg1)"/>
  
  <!-- Status bar spacer -->
  <g transform="translate(24, 60)">
    <text x="0" y="20" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" opacity="0.6">Welcome back</text>
    <text x="0" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Alex Morgan</text>
    <circle cx="310" cy="30" r="22" fill="#004AAD" opacity="0.8"/>
    <text x="310" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">AM</text>
  </g>

  <!-- Virtual Card -->
  <g transform="translate(24, 150)">
    <rect width="342" height="190" rx="20" fill="url(#cardGrad)"/>
    <text x="24" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" opacity="0.85">AQRO Platinum Card</text>
    <text x="24" y="105" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">₹ 2,48,920.00</text>
    <text x="24" y="130" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" opacity="0.75">Total Balance</text>
    <text x="24" y="165" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">•••• 8924</text>
    <text x="270" y="165" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">08/29</text>
  </g>

  <!-- Quick Actions -->
  <g transform="translate(24, 370)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#0F244A"/>
    <text x="36" y="44" fill="#5B9BFF" font-family="-apple-system, sans-serif" font-size="24" text-anchor="middle">↑</text>
    <text x="36" y="92" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Send</text>

    <rect x="90" y="0" width="72" height="72" rx="18" fill="#0F244A"/>
    <text x="126" y="44" fill="#5B9BFF" font-family="-apple-system, sans-serif" font-size="24" text-anchor="middle">↓</text>
    <text x="126" y="92" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Receive</text>

    <rect x="180" y="0" width="72" height="72" rx="18" fill="#0F244A"/>
    <text x="216" y="44" fill="#5B9BFF" font-family="-apple-system, sans-serif" font-size="24" text-anchor="middle">⇄</text>
    <text x="216" y="92" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Swap</text>

    <rect x="270" y="0" width="72" height="72" rx="18" fill="#0F244A"/>
    <text x="306" y="44" fill="#5B9BFF" font-family="-apple-system, sans-serif" font-size="24" text-anchor="middle">+</text>
    <text x="306" y="92" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">More</text>
  </g>

